services:
  - type: web
    name: mynanny
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Run schema migrations before each deploy goes live.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: mynanny-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: my-nanny-production-uploads-337903911181-af-south-1-an
      - key: S3_REGION
        value: af-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: mynanny-v2
    runtime: node
    plan: starter
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        value: https://mynanny.onrender.com

databases:
  - name: mynanny-db
    plan: basic-256mb
    postgresMajorVersion: "16"
