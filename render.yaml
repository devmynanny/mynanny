services:
  - type: web
    name: mynanny
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Run schema migrations before each deploy goes live.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      # This is the hard emergency override. Normal on/off control lives in
      # Admin > Settings and is stored in the database.
      - key: AUTOMATED_NOTIFICATIONS_ENABLED
        value: "true"
      - key: SERVICE_ROLE
        value: api-and-notification-scheduler
      - key: SERVICE_DISPLAY_NAME
        value: My Nanny API and notification scheduler
      - key: V2_BASE_URL
        value: https://mynanny-v2.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mynanny-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: my-nanny-production-uploads-337903911181-af-south-1-an
      - key: S3_REGION
        value: af-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # WhatsApp credentials and approved template SIDs are managed in Render.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_REQUIRE_TEMPLATES
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        value: https://mynanny.onrender.com/whatsapp/status
      - key: TWILIO_CONTENT_SID_BOOKING_CANCELLED
        sync: false
      - key: TWILIO_CONTENT_SID_BOOKING_CANCELLED_NANNY
        sync: false
      - key: TWILIO_CONTENT_SID_BOOKING_CONFIRMED
        sync: false
      - key: TWILIO_CONTENT_SID_BOOKING_START_REMINDER
        sync: false
      - key: TWILIO_CONTENT_SID_BROADCAST_CLOSED_NANNY
        sync: false
      - key: TWILIO_CONTENT_SID_BROADCAST_FILLED
        sync: false
      - key: TWILIO_CONTENT_SID_BROADCAST_POSITION_FILLED
        sync: false
      - key: TWILIO_CONTENT_SID_CHECKOUT_REMINDER
        sync: false
      - key: TWILIO_CONTENT_SID_CHECK_IN_CONFIRMATION_REQUIRED
        sync: false
      - key: TWILIO_CONTENT_SID_CHECK_OUT_CONFIRMATION_REQUIRED
        sync: false
      - key: TWILIO_CONTENT_SID_DECIDING_REMINDER
        sync: false
      - key: TWILIO_CONTENT_SID_MISSED_CHECK_IN
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_ACCEPTED
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_APPROVED
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_CHECKED_IN
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_DECLINED
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_LATE_ALERT
        sync: false
      - key: TWILIO_CONTENT_SID_NANNY_REACTIVATED
        sync: false
      - key: TWILIO_CONTENT_SID_NEW_BOOKING_REQUEST
        sync: false
      - key: TWILIO_CONTENT_SID_NO_NANNY_YET
        sync: false
      - key: TWILIO_CONTENT_SID_OVERTIME_REQUEST
        sync: false
      - key: TWILIO_CONTENT_SID_PASSPORT_EXPIRED_SUSPENSION
        sync: false
      - key: TWILIO_CONTENT_SID_PASSPORT_EXPIRY_WARNING
        sync: false
      - key: TWILIO_CONTENT_SID_PASSPORT_RENEWAL_APPROVED
        sync: false
      - key: TWILIO_CONTENT_SID_PAYMENT_DUE
        sync: false
      - key: TWILIO_CONTENT_SID_PAYMENT_FAILED
        sync: false
      - key: TWILIO_CONTENT_SID_PAYMENT_PENDING
        sync: false
      - key: TWILIO_CONTENT_SID_PAYMENT_SUCCESS
        sync: false
      - key: TWILIO_CONTENT_SID_PAYOUT_PENDING
        sync: false
      - key: TWILIO_CONTENT_SID_PAYOUT_SENT
        sync: false
      - key: TWILIO_CONTENT_SID_REFUND_PROCESSED
        sync: false
      - key: TWILIO_CONTENT_SID_REQUEST_EXPIRED
        sync: false
      - key: TWILIO_CONTENT_SID_REVIEW_REQUEST
        sync: false
      - key: TWILIO_CONTENT_SID_SERVICE_FEE_ADJUSTED
        sync: false
      - key: TWILIO_CONTENT_SID_SERVICE_REFUND_REQUESTED
        sync: false
      - key: TWILIO_CONTENT_SID_SERVICE_TIME_CORRECTED
        sync: false
      - key: TWILIO_CONTENT_SID_SERVICE_TIME_DISPUTED
        sync: false

  - type: web
    name: mynanny-v2
    runtime: node
    plan: starter
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_ROLE
        value: web-application
      - key: BACKEND_URL
        value: https://mynanny.onrender.com

databases:
  - name: mynanny-db
    plan: basic-256mb
    postgresMajorVersion: "16"
