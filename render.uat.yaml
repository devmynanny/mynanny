# Separate UAT Blueprint. This file is not connected to Render until the paid
# UAT cost gate is approved. Secret values are entered in Render, never here.
services:
  - type: web
    name: mynanny-uat
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: codex/permanent-placements
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: ENVIRONMENT_NAME
        value: UAT
      - key: AUTOMATED_NOTIFICATIONS_ENABLED
        value: "false"
      - key: SERVICE_ROLE
        value: api-and-notification-scheduler
      - key: SERVICE_DISPLAY_NAME
        value: My Nanny UAT API
      - key: V2_BASE_URL
        value: https://mynanny-v2-uat.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mynanny-uat-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sayhi@mynanny.co.za
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: sayhi@mynanny.co.za
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: af-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TWILIO_REQUIRE_TEMPLATES
        value: "true"

  - type: web
    name: mynanny-v2-uat
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: codex/permanent-placements
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_ROLE
        value: web-application
      - key: NEXT_PUBLIC_ENVIRONMENT_NAME
        value: UAT
      - key: BACKEND_URL
        value: https://mynanny-uat.onrender.com

databases:
  - name: mynanny-uat-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
