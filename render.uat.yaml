# Separate UAT Blueprint. It reuses the existing paid Postgres instance but
# targets a guarded logical UAT database. Secret values are entered in Render.
services:
  - type: web
    name: mynanny-uat
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: codex/permanent-placements
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/provision_uat_database.py && python scripts/assert_safe_database_target.py && alembic upgrade head
    startCommand: python scripts/assert_safe_database_target.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: ENVIRONMENT_NAME
        value: UAT
      - key: AUTOMATED_NOTIFICATIONS_ENABLED
        value: "false"
      - key: SERVICE_ROLE
        value: api-and-notification-scheduler
      - key: SERVICE_DISPLAY_NAME
        value: My Nanny UAT API
      - key: V2_BASE_URL
        value: https://mynanny-v2-uat.onrender.com
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: mynanny-db
          property: connectionString
      - key: DATABASE_NAME_OVERRIDE
        value: mynanny_uat
      - key: UAT_EXPECTED_DATABASE_NAME
        value: mynanny_uat
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sayhi@mynanny.co.za
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: sayhi@mynanny.co.za
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: my-nanny-production-uploads-337903911181-af-south-1-an
      - key: S3_KEY_PREFIX
        value: uat
      - key: S3_REGION
        value: af-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TWILIO_REQUIRE_TEMPLATES
        value: "true"

  - type: web
    name: mynanny-v2-uat
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: codex/permanent-placements
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_ROLE
        value: web-application
      - key: NEXT_PUBLIC_ENVIRONMENT_NAME
        value: UAT
      - key: BACKEND_URL
        value: https://mynanny-uat.onrender.com
