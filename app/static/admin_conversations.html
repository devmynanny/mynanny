<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="/static/theme.css" />
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Conversations</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0 auto;padding:24px;max-width:1100px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 20px}
    .muted{color:#666}
    .err{color:#b00020}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .layout{display:flex;gap:16px;height:70vh;min-height:420px}
    .listPane{width:340px;flex-shrink:0;border:1px solid #ddd;border-radius:12px;overflow-y:auto}
    .threadPane{flex:1;border:1px solid #ddd;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
    .convRow{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;display:flex;flex-direction:column;gap:4px}
    .convRow:hover{background:#f7f7f7}
    .convRow.active{background:#eef4ff}
    .convRowTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .convName{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid #ccc;color:#444}
    .badge.whatsapp{background:#e7f8ee;border-color:#bfe8cf;color:#146c2e}
    .badge.telegram{background:#e8f2fc;border-color:#bfdcf5;color:#0b5fa5}
    .unreadDot{background:#c0392b;color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
    .convPreview{font-size:13px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .threadHeader{padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
    .threadBody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    .bubble{max-width:70%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4}
    .bubble.inbound{align-self:flex-start;background:#f1f1f1}
    .bubble.outbound{align-self:flex-end;background:#dbeafe}
    .bubble.failed{background:#fde2e1}
    .bubbleMeta{font-size:11px;color:#888;margin-top:4px}
    .composer{border-top:1px solid #ddd;padding:12px;display:flex;gap:8px;align-items:flex-end}
    .composer textarea{flex:1;padding:10px;border-radius:10px;border:1px solid #ccc;resize:vertical;min-height:44px;font:inherit}
    .banner{padding:10px 14px;background:#fff3cd;border-bottom:1px solid #ffe69c;color:#664d03;font-size:13px}
    .emptyState{padding:24px;color:#888;text-align:center}
  </style>
  <script defer src="/static/nav_buttons.js"></script>
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <h1>Conversations</h1>
  <div class="muted" style="margin-bottom:12px;">WhatsApp and Telegram messages with parents and nannies.</div>

  <div class="layout">
    <div class="listPane" id="listPane">
      <div class="emptyState">Loading...</div>
    </div>
    <div class="threadPane">
      <div class="threadHeader">
        <div id="threadTitle" class="muted">Select a conversation</div>
      </div>
      <div id="windowBanner" class="banner" style="display:none;"></div>
      <div class="threadBody" id="threadBody"></div>
      <div class="composer">
        <textarea id="replyInput" placeholder="Type a reply..." disabled></textarea>
        <button class="btn" id="sendBtn" type="button" disabled>Send</button>
      </div>
    </div>
  </div>
  <div id="sendStatus" class="muted" style="margin-top:8px;"></div>

  <script src="/static/app.js?v=2"></script>
  <script>
    let selectedConversationId = null;
    let conversationsById = {};
    let listPollHandle = null;
    let threadPollHandle = null;
    let listInFlight = false;
    let threadInFlight = false;

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function formatTime(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString();
      } catch { return iso; }
    }

    function contactLabel(conv) {
      return conv.user_name || conv.external_id;
    }

    async function loadConversations() {
      if (listInFlight) return;
      listInFlight = true;
      try {
        const data = await fetchJson("/admin/conversations");
        const rows = data.results || [];
        conversationsById = {};
        rows.forEach((r) => { conversationsById[r.id] = r; });

        const pane = document.getElementById("listPane");
        if (!rows.length) {
          pane.innerHTML = '<div class="emptyState">No conversations yet.</div>';
          return;
        }
        pane.innerHTML = rows.map((r) => `
          <div class="convRow${r.id === selectedConversationId ? ' active' : ''}" data-id="${r.id}">
            <div class="convRowTop">
              <span class="convName">${escapeHtml(contactLabel(r))}</span>
              ${r.unread_count ? `<span class="unreadDot">${r.unread_count}</span>` : ""}
            </div>
            <div class="convRowTop">
              <span class="badge ${escapeHtml(r.channel)}">${escapeHtml(r.channel)}</span>
              <span class="muted" style="font-size:11px;">${formatTime(r.last_message_at)}</span>
            </div>
            <div class="convPreview">${r.last_message_direction === "outbound" ? "You: " : ""}${escapeHtml(r.last_message_preview || "")}</div>
          </div>
        `).join("");
        pane.querySelectorAll(".convRow").forEach((el) => {
          el.addEventListener("click", () => selectConversation(parseInt(el.dataset.id, 10)));
        });
      } catch (e) {
        document.getElementById("listPane").innerHTML = `<div class="emptyState err">${escapeHtml(e.message || "Failed to load")}</div>`;
      } finally {
        listInFlight = false;
      }
    }

    function updateWindowBanner(conv) {
      const banner = document.getElementById("windowBanner");
      const sendBtn = document.getElementById("sendBtn");
      const replyInput = document.getElementById("replyInput");
      if (!conv) {
        banner.style.display = "none";
        return;
      }
      if (conv.channel === "whatsapp") {
        const last = conv.last_inbound_at ? new Date(conv.last_inbound_at) : null;
        const hoursSince = last ? (Date.now() - last.getTime()) / 3600000 : Infinity;
        if (!last || hoursSince > 24) {
          banner.textContent = "This WhatsApp conversation is outside the 24-hour window - the customer needs to message first before you can reply.";
          banner.style.display = "block";
          sendBtn.disabled = true;
          replyInput.disabled = true;
          return;
        }
      }
      banner.style.display = "none";
      sendBtn.disabled = false;
      replyInput.disabled = false;
    }

    async function loadThread(conversationId) {
      if (threadInFlight) return;
      threadInFlight = true;
      try {
        const data = await fetchJson(`/admin/conversations/${conversationId}/messages`);
        const conv = data.conversation;
        document.getElementById("threadTitle").innerHTML =
          `<strong>${escapeHtml(conv.user_name || conv.external_id)}</strong> <span class="badge ${escapeHtml(conv.channel)}">${escapeHtml(conv.channel)}</span>`;
        updateWindowBanner(conv);

        const body = document.getElementById("threadBody");
        const wasAtBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
        body.innerHTML = (data.results || []).map((m) => `
          <div class="bubble ${m.direction}${m.status === "failed" ? " failed" : ""}">
            ${escapeHtml(m.body)}
            <div class="bubbleMeta">${formatTime(m.created_at)}${m.status === "failed" ? " - failed to send" : ""}</div>
          </div>
        `).join("");
        if (wasAtBottom || conversationId !== loadThread._lastLoaded) {
          body.scrollTop = body.scrollHeight;
        }
        loadThread._lastLoaded = conversationId;

        // Unread count was just cleared server-side - refresh the list to match.
        loadConversations();
      } catch (e) {
        document.getElementById("threadBody").innerHTML = `<div class="emptyState err">${escapeHtml(e.message || "Failed to load")}</div>`;
      } finally {
        threadInFlight = false;
      }
    }

    function selectConversation(id) {
      selectedConversationId = id;
      document.querySelectorAll(".convRow").forEach((el) => {
        el.classList.toggle("active", parseInt(el.dataset.id, 10) === id);
      });
      loadThread(id);
      if (threadPollHandle) clearInterval(threadPollHandle);
      threadPollHandle = setInterval(() => loadThread(selectedConversationId), 5000);
    }

    async function sendReply() {
      if (!selectedConversationId) return;
      const input = document.getElementById("replyInput");
      const body = input.value.trim();
      if (!body) return;
      const sendBtn = document.getElementById("sendBtn");
      const statusEl = document.getElementById("sendStatus");
      sendBtn.disabled = true;
      statusEl.className = "muted";
      statusEl.textContent = "Sending...";
      try {
        await fetchJson(`/admin/conversations/${selectedConversationId}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body }),
        });
        input.value = "";
        statusEl.textContent = "";
      } catch (e) {
        statusEl.className = "err";
        statusEl.textContent = e.message || "Failed to send";
      } finally {
        sendBtn.disabled = false;
        // Refresh either way - a failed attempt still records a "failed"
        // bubble server-side and the admin should see it immediately.
        await loadThread(selectedConversationId);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendReply);
    document.getElementById("replyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendReply();
      }
    });

    (async () => {
      const me = await requireMe();
      if (!me?.is_admin) { location.href = "/static/login.html"; return; }
      await loadConversations();
      listPollHandle = setInterval(loadConversations, 15000);
    })();
  </script>
</body>
</html>
